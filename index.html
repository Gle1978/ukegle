<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6B4A">
<meta name="description" content="UkeGle เว็บแอปหัดเล่นอูคูเลเลสำหรับมือใหม่ คอร์ดง่าย เพลงย้อนยุคไทยและสากล">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UkeGle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>UkeGle</title>
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&family=Kanit:wght@500;600;700&display=swap">
<style>
/* Layout: one phone-width column, content scrolls, bottom tab bar pinned; song sheet widens in stand mode */
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --soft:#FDEBD3; --ink:#2B2118; --muted:#7A6A5C; --line:#EADBC8;
  --pri:#FF6B4A; --pri-text:#C9442A; --on-pri:#FFFFFF; --sec:#1FA39A; --sec-text:#127068; --ok:#22A06B;
  --wood:#F6E3C6; --fret:#8C6A4A; --nut:#2B2118;
  --f1:#1FA39A; --f2:#FF6B4A; --f3:#E59E00; --f4:#8B5CF6;
  --l0:#DDF5EC; --l1:#D6F0EE; --l2:#FFF0C7; --l3:#FFE0D8;
  --dark-panel:#2B2118; --on-dark:#FFFFFF;
  --display:"Kanit","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --body:"Anuphan","Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;
  --r-md:16px; --r-lg:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1A1510; --card:#241E18; --soft:#3A2A1C; --ink:#F6ECDF; --muted:#B9A893; --line:#3D3329;
  --pri-text:#FF8E73; --sec-text:#5CCFC4; --wood:#3B3026; --fret:#B8946B; --nut:#F6ECDF;
  --l0:#173A30; --l1:#163836; --l2:#3D3317; --l3:#45271D; --dark-panel:#0F0C09; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A1510; --card:#241E18; --soft:#3A2A1C; --ink:#F6ECDF; --muted:#B9A893; --line:#3D3329;
  --pri-text:#FF8E73; --sec-text:#5CCFC4; --wood:#3B3026; --fret:#B8946B; --nut:#F6ECDF;
  --l0:#173A30; --l1:#163836; --l2:#3D3317; --l3:#45271D; --dark-panel:#0F0C09; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--sec);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.app.wide{max-width:1040px}
main{flex:1;padding:24px 16px 120px;display:flex;flex-direction:column;gap:24px}
.muted{color:var(--muted)} .cap{font-size:13px;line-height:1.5}
.eyebrow{font-family:var(--display);font-weight:500;font-size:12px;letter-spacing:.04em}
.stack{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.soft{background:var(--soft);border-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 24px;border-radius:999px;border:0;background:var(--pri);color:var(--on-pri);font-weight:500}
.btn.block{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{min-height:36px;padding:4px 16px;font-size:14px}
.btn.soft-btn{background:var(--soft);color:var(--ink)}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:4px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:500;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:999px;font-family:var(--display);font-weight:500;font-size:12px;white-space:nowrap}
.lv0{background:var(--l0)} .lv1{background:var(--l1)} .lv2{background:var(--l2)} .lv3{background:var(--l3)}
.brand{font-family:var(--display);font-weight:700;font-size:34px;color:var(--pri-text);line-height:1.1}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.tabbar .in{max-width:560px;margin:0 auto;display:flex;justify-content:space-between}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0;color:var(--muted);font-family:var(--display);font-size:12px;font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--pri-text)}
/* chord diagram */
.chord-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
button.chord-card{width:100%}
.chord-card .nm{font-family:var(--display);font-weight:600;font-size:20px;line-height:1}
.chord-card.known{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.chord-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.diagram{display:block}
.legend{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block}
/* songs */
.song{display:flex;flex-direction:column;gap:6px;text-align:left;width:100%}
.song-top{display:flex;gap:12px;align-items:center}
.cover{width:44px;height:44px;border-radius:12px;background:var(--l2);display:grid;place-items:center;flex:none;color:var(--ink)}
.cover.ok{background:var(--l0)}
.song-title{font-weight:500;line-height:1.35}
.song-chords{font-family:var(--display);font-weight:600;color:var(--pri-text);font-size:15px}
.listen{display:inline-flex;align-items:center;gap:8px;padding:4px 14px;border-radius:999px;background:var(--soft);text-decoration:none;font-weight:500;font-size:14px;align-self:flex-start}
/* progress */
.track{height:10px;border-radius:5px;background:var(--l1);overflow:hidden}
.track i{display:block;height:100%;background:var(--sec);border-radius:5px;transition:width .4s}
/* path */
.path{display:flex;flex-direction:column}
.stage{display:grid;grid-template-columns:40px 1fr;gap:12px}
.rail{display:flex;flex-direction:column;align-items:center}
.node{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font-family:var(--display);font-weight:600;flex:none}
.node.done{background:var(--ok);color:#fff} .node.now{background:var(--pri);color:#fff}
.rail .ln{width:4px;flex:1;background:var(--line);min-height:16px}
.rail .ln.done{background:var(--ok)}
.stage .card{margin-bottom:16px}
.stage.now .card{background:var(--soft);border:2px solid var(--pri)}
.stage.lock .card{opacity:.72}
.cpill{display:inline-flex;padding:2px 10px;border-radius:8px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:600}
/* tuner guide */
.readouts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.readout{background:var(--dark-panel);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--on-dark);text-align:center}
.readout b{font-family:var(--display);font-size:26px;line-height:1}
.readout small{font-family:var(--display);font-size:12px;line-height:1.35}
.string-row{display:flex;gap:12px;align-items:center}
.note{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:20px;color:#fff;flex:none}
.num{width:32px;height:32px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
/* sheet */
.sheet-head{display:flex;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;flex:none;color:var(--ink)}
.iconbtn:hover{background:var(--soft)}
.sheet-chords{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.beats{display:flex;justify-content:space-between;gap:4px}
.beat{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;flex:1}
.beat svg{width:28px;height:28px}
.beat small{font-size:12px;color:var(--muted);font-family:var(--display)}
.lyrics{display:flex;flex-direction:column;gap:6px;font-size:var(--lyric,20px)}
.lyrics .sec{font-family:var(--display);font-size:12px;color:var(--muted);margin-top:10px;letter-spacing:.04em}
.line{display:flex;flex-wrap:wrap;column-gap:.3em;align-items:flex-end}
.chunk{display:inline-flex;flex-direction:column}
.chunk .c{font-family:var(--display);font-weight:600;color:var(--pri-text);font-size:.85em;line-height:1.2;min-height:1.2em}
.chunk .w{font-weight:500;line-height:1.35;white-space:pre}
.dock{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:15;padding:8px 16px;pointer-events:none}
.dock .in{max-width:560px;margin:0 auto;background:var(--dark-panel);color:var(--on-dark);border-radius:var(--r-lg);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:auto}
.app.wide ~ .dock .in{max-width:1040px}
.play{width:48px;height:48px;border-radius:50%;background:var(--pri);border:0;display:grid;place-items:center;color:#fff;flex:none}
.stepper{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0}
.stepper small{font-size:12px;opacity:.75}
.stepper .row{gap:4px;flex-wrap:nowrap}
.stepper button{width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;line-height:1}
.stepper b{font-weight:500;min-width:3.2em;text-align:center}
.placeholder{border:1.5px dashed var(--line);border-radius:var(--r-md);padding:16px;display:flex;flex-direction:column;gap:6px}
.stand-grid{display:grid;gap:24px}
.app.wide .stand-grid{grid-template-columns:150px minmax(0,1fr)}
.app.wide .stand-grid .sheet-chords{grid-template-columns:1fr;position:sticky;top:12px;align-self:start}
.app.wide .lyrics{--lyric:26px}
/* onboarding */
.ob{min-height:100%;display:flex;flex-direction:column;justify-content:space-between;gap:24px;padding:32px 24px calc(32px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto}
.ob .top{display:flex;flex-direction:column;gap:20px}
.ob .bot{display:flex;flex-direction:column;gap:8px}
.splash{background:var(--pri);color:#fff;justify-content:center;align-items:center;text-align:center;max-width:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.steps i{height:8px;border-radius:4px;background:var(--line)} .steps i.on{background:var(--pri)}
.opt{display:flex;gap:16px;align-items:center;padding:16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--card);text-align:left;width:100%}
.opt[aria-checked="true"]{background:var(--l1);border:2px solid var(--sec)}
.opt .em{width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px;flex:none}
.opt .radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-left:auto}
.opt[aria-checked="true"] .radio{background:var(--sec);border-color:var(--sec)}
.str-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.str-pick button{border-radius:14px;padding:10px 4px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;font-family:var(--display)}
.str-pick button b{font-size:20px} .str-pick button small{font-size:12px;color:var(--muted)}
.str-pick button[aria-pressed="true"]{color:#fff;border-color:transparent}
.str-pick button[aria-pressed="true"] small{color:#fff}
.hero-circle{width:min(300px,80vw);aspect-ratio:1;border-radius:50%;background:var(--soft);display:grid;place-items:center;margin:0 auto;max-width:100%}
.celebrate{position:relative;height:240px}
.celebrate .ok{position:absolute;left:50%;top:40px;transform:translateX(-50%);width:150px;height:150px;border-radius:50%;background:var(--ok);display:grid;place-items:center}
.conf{position:absolute;border-radius:50%}
/* bottom sheet */
.scrim{position:fixed;inset:0;background:rgba(20,14,8,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet-modal{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:90%;overflow:auto}
.howto{display:flex;flex-direction:column;gap:8px}
.howto div{display:flex;gap:12px;align-items:center}
.fbadge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:50;font-weight:500;font-size:14px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.on-sheet.standing .tabbar{display:none}
.on-sheet.standing .dock{bottom:0;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
@media (max-height:520px){.on-sheet .tabbar{display:none}.on-sheet .dock{bottom:0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
 .dock .in{padding:4px 12px}.play{width:40px;height:40px}.stepper small{display:none}.on-sheet main{padding-top:12px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.celebrate .ok{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
</style>

</head>

function stageState(i){const st=STAGES[i]; if(st.c.every(known)) return 'done'; const first=STAGES.findIndex(x=>!x.c.every(known)); return i===first?'now':'lock';}
function songsUnlockedBy(i){const before=new Set(STAGES.slice(0,i+1).flatMap(s=>s.c)); const prev=new Set(STAGES.slice(0,i).flatMap(s=>s.c));
 return SONGS.filter(s=>s.c.every(c=>before.has(c)) && !s.c.every(c=>prev.has(c)));}

/* ================= AUDIO (plucked-string synth) ================= */
let AC=null;
function pluck(freq,when){const sr=AC.sampleRate,dur=2.2,len=Math.floor(sr*dur),N=Math.max(2,Math.round(sr/freq));
 const buf=AC.createBuffer(1,len,sr),d=buf.getChannelData(0),ring=new Float32Array(N);
 for(let i=0;i<N;i++)ring[i]=Math.random()*2-1;
 for(let i=0;i<len;i++){const a=i%N,b=(i+1)%N; d[i]=ring[a]; ring[a]=0.4985*(ring[a]+ring[b]);}
 const src=AC.createBufferSource(); src.buffer=buf; const g=AC.createGain(); g.gain.value=0.22;
 const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200;
 src.connect(lp).connect(g).connect(AC.destination); src.start(when);}
function playChord(name){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended')AC.resume();
 const base=[392,261.63,329.63,440]; const t=AC.currentTime+0.02;
 CHORDS[name].frets.forEach((f,i)=>pluck(base[i]*Math.pow(2,f/12),t+i*0.035));}catch(e){toast('เล่นเสียงไม่ได้ในเบราว์เซอร์นี้');}}

const ic=(n,s=24)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true">${ICON[n]}</svg>`;
function diagram(name,w=100){const ch=CHORDS[name],SX=[14,38,62,86],NUT=10,FR=28,h=NUT+FR*4+4;
 let s=`<svg class="diagram" width="${w}" height="${w*h/100}" viewBox="0 0 100 ${h}" role="img" aria-label="แผนภาพคอร์ด ${name}">`;
 s+=`<rect x="4" y="${NUT}" width="92" height="${FR*4}" rx="4" fill="var(--wood)"/><rect x="4" y="${NUT-6}" width="92" height="6" rx="2" fill="var(--nut)"/>`;
 for(let i=1;i<=4;i++)s+=`<rect x="4" y="${NUT+FR*i-1}" width="92" height="2" fill="var(--fret)"/>`;
 SX.forEach((x,i)=>s+=`<rect x="${x-1}" y="${NUT}" width="${i?2:1.5}" height="${FR*4}" fill="var(--fret)"/>`);
 ch.dots.forEach(([si,f,fg])=>{const cy=NUT+FR*(f-0.5);s+=`<circle cx="${SX[si]}" cy="${cy}" r="11" fill="var(--f${fg})"/><text x="${SX[si]}" y="${cy+4.5}" text-anchor="middle" font-size="13" font-weight="600" fill="#fff" font-family="Kanit, sans-serif">${fg}</text>`;});
 return s+'</svg>';}
function chordCard(name,{btn=true,size=100,badge=true}={}){const n=nFing(name);
 const inner=`<span class="nm">${name}</span>${diagram(name,size)}<span class="cap muted" style="letter-spacing:.2em">G C E A</span>${badge?`<span class="badge lv${Math.min(n,3)}">${known(name)?'✓ ทำได้แล้ว':n?`ใช้ ${n} นิ้ว`:'ไม่ใช้นิ้วเลย'}</span>`:''}`;
 return btn?`<button class="chord-card${known(name)?' known':''}" data-chord="${name}" aria-label="คอร์ด ${name} แตะเพื่อดูวิธีจับ">${inner}</button>`:`<div class="chord-card">${inner}</div>`;}
function strumHTML(p){return `<div class="beats">${p.split(' ').map((t,i)=>`<div class="beat" style="color:${t==='-'?'var(--line)':t==='U'?'var(--sec)':'var(--pri)'}">${t==='-'?`<svg width="28" height="28" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>`:ic(t==='U'?'up':'down',28)}<small>${t==='-'?'เว้น':t==='U'?'ขึ้น':'ลง'}</small></div>`).join('')}</div>`;}
const strumText=p=>p.split(' ').map(t=>t==='-'?'–':t==='U'?'ขึ้น':'ลง').join(' ');
function songItem(s){const ok=playable(s),m=missing(s);
 return `<div class="card song"><button class="song-top" data-song="${s.id}" style="background:none;border:0;padding:0;text-align:left;width:100%">

  if(view.step===0)setTimeout(()=>{if(view.name==='ob'&&view.step===0){view.step=1;render();}},1300);return;}
 const fn={home:vHome,chords:vChords,songs:vSongs,tune:vTune,buy:vBuy,path:vPath,sheet:vSheet}[view.name];
 const wide=view.name==='sheet'&&view.stand;document.body.classList.toggle('on-sheet',view.name==='sheet');document.body.classList.toggle('standing',wide);
 r.innerHTML=`<div class="app${wide?' wide':''}"><main>${fn()}</main></div>`;

 $('#tabs').innerHTML=`<nav class="tabbar" aria-label="เมนูหลัก"><div class="in">${TABS.map(([k,l])=>`<button class="tab" data-go="${k}" ${active===k?'aria-current="page"':''}>${ic(k)}<span>${l}</span></button>`).join('')}</div></nav>`;

function go(name,extra){stopScroll();view=Object.assign({name,step:0,song:null,stand:false},extra||{});try{history.replaceState(null,'',name==='sheet'?'#'+name:'#'+name)}catch(e){}render();}

/* ---------- autoscroll ---------- */
const scroll={on:false,speed:0,raf:0,last:0,lock:null,acc:0};
const SPEEDS=[18,32,52];
function stepScroll(t){if(!scroll.on)return;const dt=scroll.last?(t-scroll.last)/1000:0;scroll.last=t;scroll.acc+=SPEEDS[scroll.speed]*dt;
 if(scroll.acc>=1){const px=Math.floor(scroll.acc);scroll.acc-=px;window.scrollBy(0,px);}
 if(window.innerHeight+window.scrollY>=document.documentElement.scrollHeight-2){stopScroll();render(true);return;}
 scroll.raf=requestAnimationFrame(stepScroll);}
async function startScroll(){scroll.on=true;scroll.last=0;scroll.acc=0;scroll.raf=requestAnimationFrame(stepScroll);
 try{if(navigator.wakeLock)scroll.lock=await navigator.wakeLock.request('screen');}catch(e){}}
function stopScroll(){scroll.on=false;cancelAnimationFrame(scroll.raf);try{scroll.lock&&scroll.lock.release();}catch(e){}scroll.lock=null;}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const t=e.target.closest('button,[data-act]');if(!t)return;const d=t.dataset;
 if(d.play){playChord(d.play);return;}
 if(d.chord){openChord(d.chord);return;}
 if(d.song){go('sheet',{song:d.song});return;}
 if(d.go){go(d.go);return;}
 if(d.cf){S.chordFilter=d.cf;save();render(true);return;}
 if(d.sf){S.songFilter=d.sf;save();render(true);return;}
 if(d.opt){const [k,v]=d.opt.split(':');S[k]=v==='true'?true:v==='false'?false:v;save();render();return;}
 if(d.tune!==undefined){obTmp.tuned[+d.tune]=!obTmp.tuned[+d.tune];render();return;}
 const a=d.act;
 if(a==='close'){if(e.target===t||t.tagName==='BUTTON')$('#modal').innerHTML='';return;}
 if(a==='toggle'){const c=d.c;S.known=known(c)?S.known.filter(x=>x!==c):[...S.known,c];save();
   const before=STAGES.findIndex((_,i)=>stageState(i)==='now');$('#modal').innerHTML='';render(true);
   if(known(c)){const ok=SONGS.filter(s=>playable(s)&&s.c.includes(c));toast(ok.length?`เยี่ยม! ตอนนี้เล่นได้ ${SONGS.filter(playable).length} เพลง`:`บันทึกแล้ว: ทำคอร์ด ${c} ได้`);}return;}
 if(a==='skip'){S.onboarded=true;save();go('home');return;}
 if(a==='next'){if(view.step===2&&S.hasUke===false){S.onboarded=true;save();go('buy');toast('เลือกเครื่องได้แล้ว กลับมาฝึกที่หน้าแรกได้เลย');return;}
   if(view.step===3&&S.exp==='can'){if(!known('C'))S.known.push('C');if(!known('Am'))S.known.push('Am');S.onboarded=true;save();go('songs');return;}
   view.step++;render();return;}
 if(a==='firstchord'){if(!known('C'))S.known.push('C');save();view.step=6;render();return;}
 if(a==='finish'){S.onboarded=true;save();go('home');return;}
 if(a==='reset'){if(t.dataset.confirm){S={onboarded:false,known:[],hasUke:true,exp:'none',lyric:20,songFilter:'all',chordFilter:'all'};save();view={name:'ob',step:0};render();return;}
   t.dataset.confirm='1';t.textContent='แตะอีกครั้งเพื่อยืนยัน (ลบความคืบหน้าทั้งหมด)';return;}
 if(a==='stand'){view.stand=!view.stand;render(true);return;}
 if(a==='auto'){scroll.on?stopScroll():startScroll();$('#dockwrap').innerHTML=dockHTML();if(view.stand)$('.dock .in').style.maxWidth='1040px';return;}
 if(a==='spd-'||a==='spd+'){scroll.speed=Math.max(0,Math.min(2,scroll.speed+(a==='spd+'?1:-1)));$('#dockwrap').innerHTML=dockHTML();return;}
 if(a==='fz-'||a==='fz+'){const L=[18,20,24,28];let i=L.indexOf(S.lyric);if(i<0)i=1;i=Math.max(0,Math.min(3,i+(a==='fz+'?1:-1)));S.lyric=L[i];save();
   const ly=$('.lyrics');if(ly)ly.style.setProperty('--lyric',S.lyric+'px');$('#dockwrap').innerHTML=dockHTML();return;}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').innerHTML='';});
window.addEventListener('wheel',()=>{},{passive:true});
['touchstart','wheel'].forEach(ev=>window.addEventListener(ev,()=>{if(scroll.on){/* user takes over */}},{passive:true}));

/* deep link: #chords, #songs, #tune, #buy, #path */
(function(){const h=(location.hash||'').slice(1);if(S.onboarded&&['home','chords','songs','tune','buy','path'].includes(h))view.name=h;})();
render();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
</body>
</html>
